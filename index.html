<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons (Elpisoft brand kit) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0E1B3D" />

    <meta name="author" content="Elpisoft" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Tags shared by every page -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elpisoft" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Elpisoft. Software built on hope." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="Elpisoft. Software built on hope." />

    <!--
      Route-specific tags (title, description, robots, canonical, Open Graph, Twitter, JSON-LD).
      scripts/prerender.mjs regenerates this block for every route at build time from src/seo/routeMeta.js.
      The home-page values below are what the dev server uses.
    -->
    <!--seo-head-->
    <title>Elpisoft — Custom software, web and mobile development</title>
    <meta name="description" content="Elpisoft is a software studio in Bacolod City, Philippines. We build custom software, web and mobile apps, automation and practical AI, and work with clients remotely." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.elpisoft.com/" />
    <meta property="og:title" content="Elpisoft — Custom software, web and mobile development" />
    <meta property="og:description" content="Elpisoft is a software studio in Bacolod City, Philippines. We build custom software, web and mobile apps, automation and practical AI, and work with clients remotely." />
    <meta property="og:url" content="https://www.elpisoft.com/" />
    <meta property="og:image" content="https://www.elpisoft.com/og-image.png" />
    <meta name="twitter:title" content="Elpisoft — Custom software, web and mobile development" />
    <meta name="twitter:description" content="Elpisoft is a software studio in Bacolod City, Philippines. We build custom software, web and mobile apps, automation and practical AI, and work with clients remotely." />
    <meta name="twitter:image" content="https://www.elpisoft.com/og-image.png" />
    <!--/seo-head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
